<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Artemis Mission Control | Prosperity API</title>
    <!-- Load Three.js 3D Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body { 
            margin: 0; 
            overflow: hidden; 
            background-color: #020205; 
            font-family: 'Courier New', Courier, monospace; 
        }
        
        /* Aerospace Glass-Morphism Dashboard */
        #ui-container {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(10, 25, 47, 0.85); /* Deep space blue/grey */
            border: 1px solid #00ffcc;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.15);
            width: 320px;
            backdrop-filter: blur(5px);
        }

        h1 { 
            margin-top: 0; 
            font-size: 1.2rem; 
            text-transform: uppercase; 
            letter-spacing: 2px; 
            color: #00ffcc;
            border-bottom: 1px solid rgba(0, 255, 204, 0.3); 
            padding-bottom: 12px; 
            margin-bottom: 20px;
        }

        .telemetry-row { 
            display: flex; 
            justify-content: space-between; 
            margin-bottom: 12px; 
            font-size: 0.95rem; 
        }

        .label { color: #8892b0; }
        .value { font-weight: bold; color: #e6f1ff; }
        
        .status-live { 
            color: #00ffcc; 
            font-weight: bold; 
            text-shadow: 0 0 8px rgba(0, 255, 204, 0.6);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body>

    <!-- Heads Up Display (HUD) -->
    <div id="ui-container">
        <h1>Artemis I: Auto-Nav</h1>
        <div class="telemetry-row">
            <span class="label">API STATUS:</span>
            <span class="status-live">SECURE UPLINK</span>
        </div>
        <div class="telemetry-row">
            <span class="label">MISSION TIME:</span>
            <span class="value" id="time">0.00 s</span>
        </div>
        <div class="telemetry-row">
            <span class="label">ORBIT SPEED:</span>
            <span class="value" id="speed">0.00 m/s</span>
        </div>
        <div class="telemetry-row">
            <span class="label">X POS:</span>
            <span class="value" id="x">0.00 km</span>
        </div>
        <div class="telemetry-row">
            <span class="label">Y POS:</span>
            <span class="value" id="y">0.00 km</span>
        </div>
        <div class="telemetry-row">
            <span class="label">FUEL MASS:</span>
            <span class="value" id="fuel">0.00 kg</span>
        </div>
    </div>

    <!-- Load the 3D Engine -->
    <script src="app.js"></script>
</body>
</html>
